<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PLATEAU City Viewer</title>
  <meta name="description" content="Walk a real Tokyo block from Japan's PLATEAU 3D city models and break buildings one by one. three.js, MIT." />
  <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
  <style>
    :root { --fg: #f4f6f8; --muted: #b9c2cc; --glass: rgba(16, 20, 26, .62); --line: rgba(255,255,255,.14); --accent: #ffb347; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd3e6; font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--fg); }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .panel { position: fixed; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px; }
    #hud { top: 12px; left: 12px; padding: 10px 14px; }
    #hud b { font-size: 15px; letter-spacing: .02em; }
    #hud .row { color: var(--muted); font-size: 12px; margin-top: 2px; }
    #count { color: var(--accent); font-variant-numeric: tabular-nums; }
    #cta { top: 12px; right: 12px; padding: 8px 12px; font-size: 12px; color: var(--fg); text-decoration: none; max-width: 46vw; }
    #cta:hover { border-color: var(--accent); }
    #cta span { color: var(--accent); }
    #attr { position: fixed; right: 8px; bottom: 6px; font-size: 10px; color: #1d2733; background: rgba(255,255,255,.7); padding: 2px 6px; border-radius: 4px; max-width: 70vw; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px #000; }
    #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
    #crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
    #intro { inset: 0; position: fixed; z-index: 5; display: grid; place-items: center; background: rgba(10, 14, 20, .35); cursor: pointer; }
    #intro[hidden] { display: none; }
    #intro .card { padding: 18px 22px; max-width: 420px; margin: 16px; }
    #intro h1 { font-size: 18px; margin: 0 0 6px; }
    #intro p { margin: 6px 0; color: var(--muted); }
    #intro kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--fg); }
    #intro .go { margin-top: 12px; display: inline-block; background: var(--accent); color: #1b1305; font-weight: 600; padding: 7px 14px; border-radius: 8px; }
    .touch { display: none; }
    #help dl.touch { display: none; }
    @media (pointer: coarse) { .touch { display: flex; } #help dl.touch { display: grid; } .desk, #help dl.desk { display: none; } }
    #tools { position: fixed; left: 12px; bottom: 28px; gap: 8px; display: flex; z-index: 10; }
    #tools button { border: 1px solid var(--line); background: var(--glass); color: var(--fg); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    /* right-bottom dock: always-on controls help (+ jump button on touch) */
    #dock { position: fixed; right: 12px; bottom: 44px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 6; }
    #help { padding: 9px 12px; font-size: 12px; pointer-events: none; position: static; max-width: 300px; }
    #help h2 { font-size: 12px; margin: 0 0 5px; color: var(--accent); letter-spacing: .04em; font-weight: 600; }
    #help dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
    #help dt { color: var(--fg); white-space: nowrap; }
    #help dd { margin: 0; color: var(--muted); }
    #help kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
    #pad button { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--fg); font-weight: 600; font-size: 11px; white-space: nowrap; padding: 0; }
    @media (max-width: 640px) {
      #cta { top: 78px; left: 12px; right: auto; max-width: calc(100vw - 24px); }
      #attr { left: 8px; right: 8px; max-width: none; font-size: 9px; }
      #tools { bottom: 68px; flex-direction: column; align-items: flex-start; }
      #dock { bottom: 68px; }
      #help { max-width: calc(100vw - 150px); font-size: 11px; padding: 8px 10px; }
      #help dl { grid-template-columns: 1fr; gap: 0; }
      #help dd { margin-bottom: 3px; }
      #intro { place-items: start center; padding-top: 128px; }
    }
    #status { position: fixed; left: 50%; top: 45%; transform: translateX(-50%); color: #1d2733; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="crosshair"></div>
  <div id="status"></div>

  <div id="hud" class="panel">
    <b>PLATEAU City Viewer</b> · <span id="place"></span>
    <div class="row"><span data-i18n="broken">Broken buildings</span> <span id="count">0 / 0</span></div>
  </div>

  <a id="cta" class="panel" href="https://bun-cho.work/developers/city?utm_source=plateau-city-viewer&utm_medium=demo" target="_blank" rel="noopener">
    <span data-i18n="cta">Photoreal version of this block →</span> <span data-i18n="ctaName">BunCho City API</span>
  </a>

  <div id="tools">
    <button id="btn-stomp" type="button" data-i18n="stomp">Stomp (E)</button>
    <button id="btn-reset" type="button" data-i18n="rebuild">Rebuild</button>
    <button id="btn-lang" type="button" aria-label="Language">日本語</button>
  </div>
  <div id="dock">
    <div id="pad" class="touch"><button id="btn-jump" type="button" data-i18n="jump">Jump</button></div>
    <div id="help" class="panel" aria-live="polite">
      <h2 data-i18n="helpTitle">Controls</h2>
      <dl class="desk" data-i18n-html="helpDesk"></dl>
      <dl class="touch" data-i18n-html="helpTouch"></dl>
    </div>
  </div>

  <div id="intro">
    <div class="card panel" style="position:relative">
      <h1 data-i18n="introTitle">Walk a real block of Ginza, Tokyo</h1>
      <p data-i18n="introBody">Every building is a separate PLATEAU building with its own hit box. Shoot one until it falls.</p>
      <span class="go" data-i18n="start">Start</span>
    </div>
  </div>

  <div id="attr"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
